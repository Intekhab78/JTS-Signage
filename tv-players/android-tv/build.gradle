plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jts.signage'
    compileSdk 36

    defaultConfig {
        applicationId "com.jts.signage"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
}
